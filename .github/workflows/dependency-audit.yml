name: Dependency vulnerability audit

on:
  push:
    branches:
      - security/consolidate-dependabot-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate npm lock file
        run: npm ci --ignore-scripts --no-audit
      - name: Get npm vulnerability report
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('AUDIT_METADATA', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
            console.log('NPM_ALERT', JSON.stringify({
              name, severity: v.severity, isDirect: v.isDirect, range: v.range,
              fixAvailable: v.fixAvailable, via: v.via.filter(x=>typeof x==='object').map(x=>({title:x.title,url:x.url,range:x.range,severity:x.severity}))
            }));
          }
          NODE
      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json

  composer-audit:
    name: Composer dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Get Composer vulnerability report
        run: |
          composer --version
          composer audit --locked --format=json --no-interaction > composer-audit.json || true
          php -r '$d=json_decode(file_get_contents("composer-audit.json"),true); if(!is_array($d)) { echo file_get_contents("composer-audit.json"); exit(0); } echo "COMPOSER_METADATA ".json_encode(array_keys($d))."\n"; foreach(($d["advisories"]??[]) as $name=>$v) { foreach($v as $a) { echo "COMPOSER_ALERT ".json_encode(["name"=>$name,"id"=>$a["advisoryId"]??null,"title"=>$a["title"]??null,"affected"=>$a["affectedVersions"]??null,"link"=>$a["link"]??null,"severity"=>$a["severity"]??null])."\n"; }} foreach(($d["abandoned"]??[]) as $name=>$v){echo "COMPOSER_ABANDONED ".$name."\n";}'
      - name: Upload Composer audit report
        uses: actions/upload-artifact@v4
        with:
          name: composer-audit-report
          path: composer-audit.json
